  <g transform="translate(150 150)" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round">
    <circle r="82" stroke-width="7"/>
    <path d="M-58 40 A70 70 0 1 1 58 40" stroke="#475569"/>
