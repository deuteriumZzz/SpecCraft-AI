  </g>
  <text x="290" y="140" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="68" font-weight="700">SpecCraft AI</text>
  <text x="292" y="196" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30">Карточка КИП из JSON за секунды.</text>
  <text x="292" y="238" fill="#93c5fd" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30">Без выдуманных характеристик.</text>
