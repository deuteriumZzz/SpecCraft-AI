<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Черновик карточки контрольно-измерительного прибора из JSON или формы: заголовок, описание, характеристики, запросы.">
  <title>SpecCraft AI — карточка товара</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind.css">
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased">
  <a href="#output"
    class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-20 focus:rounded-md focus:bg-accent focus:px-3 focus:py-2 focus:text-sm focus:text-accent-ink">Перейти к результату</a>
  <div id="progress" hidden class="fixed inset-x-0 top-0 z-10 h-0.5 overflow-hidden bg-rule" aria-hidden="true">
    <div class="h-full w-1/3 bg-accent motion-safe:animate-indeterminate motion-reduce:w-full"></div>
  </div>

  <header class="border-b border-rule">
    <div class="mx-auto flex h-12 max-w-[88rem] items-center justify-between px-4 sm:px-6">
      <div class="flex items-baseline gap-3">
        <span class="text-[15px] font-semibold tracking-tight">SpecCraft</span>
        <span class="hidden text-xs text-ink-2 sm:inline">Карточка КИП из JSON</span>
      </div>
      <span class="font-mono text-[11px] uppercase tracking-widest text-ink-2">Черновик</span>
    </div>
  </header>

  <main class="mx-auto grid max-w-[88rem] lg:min-h-[calc(100vh-3rem)] lg:grid-cols-[minmax(22rem,2fr)_3fr]">
    <section id="input-pane" aria-labelledby="in-title"
      class="flex flex-col gap-3 p-4 transition-shadow duration-fast sm:p-6 lg:sticky lg:top-0 lg:h-[calc(100vh-3rem)] lg:self-start lg:overflow-y-auto">
      <div class="flex items-center justify-between gap-3">
        <h2 id="in-title" class="text-[11px] font-semibold uppercase tracking-widest text-ink-2">Исходные данные</h2>
        <div role="tablist" aria-label="Способ ввода" class="inline-flex rounded-md border border-rule p-0.5 text-sm">
          <button id="mode-json" role="tab" data-mode="json" aria-selected="true" aria-controls="json-panel" type="button"
            class="mode rounded px-3 py-1 text-ink-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent aria-selected:bg-accent aria-selected:font-medium aria-selected:text-accent-ink motion-safe:transition-colors motion-safe:duration-fast">JSON</button>
          <button id="mode-form" role="tab" data-mode="form" aria-selected="false" aria-controls="form-panel" type="button"
            class="mode rounded px-3 py-1 text-ink-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent aria-selected:bg-accent aria-selected:font-medium aria-selected:text-accent-ink motion-safe:transition-colors motion-safe:duration-fast">Форма</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
        <button id="example" type="button"
          class="rounded-sm text-accent underline decoration-accent/40 underline-offset-4 hover:decoration-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Пример</button>
        <button id="load" type="button"
          class="rounded-sm text-accent underline decoration-accent/40 underline-offset-4 hover:decoration-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Загрузить .json</button>
        <button id="clear" type="button"
          class="rounded-sm text-ink-2 underline decoration-rule underline-offset-4 hover:text-ink hover:decoration-ink-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Очистить</button>
        <input id="file" type="file" accept=".json,application/json" class="sr-only" tabindex="-1" aria-label="Файл JSON">
      </div>

      <div id="json-panel" role="tabpanel" aria-labelledby="mode-json" class="flex flex-1 flex-col gap-3">
        <label for="input" class="sr-only">Данные о товаре в формате JSON</label>
        <textarea id="input" spellcheck="false" maxlength="30000"
          class="min-h-[18rem] w-full flex-1 resize-y rounded-md border border-rule bg-sheet p-3 font-mono text-[13px] leading-6 placeholder:text-ink-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent"
          placeholder='{"name": "…", "manufacturer": "…", "specs": {"ключ": "значение"}, "description": "…"}'></textarea>
        <p id="json-state" aria-live="polite" class="min-h-4 font-mono text-xs text-ink-2">&nbsp;</p>
      </div>

      <div id="form-panel" role="tabpanel" aria-labelledby="mode-form" hidden class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="f-name" class="text-sm font-medium">Название <span class="font-normal text-ink-2">· обязательно</span></label>
          <input id="f-name" type="text" autocomplete="off" maxlength="200"
            class="w-full rounded-md border border-rule bg-sheet px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="f-maker" class="text-sm font-medium">Производитель</label>
          <input id="f-maker" type="text" autocomplete="off" maxlength="200"
            class="w-full rounded-md border border-rule bg-sheet px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">
        </div>
        <fieldset class="flex flex-col gap-2">
          <legend class="mb-1.5 text-sm font-medium">Характеристики</legend>
          <div id="f-specs" class="flex flex-col gap-2"></div>
          <button id="f-add" type="button"
            class="self-start rounded-sm text-sm text-accent underline decoration-accent/40 underline-offset-4 hover:decoration-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Добавить характеристику</button>
        </fieldset>
        <div class="flex flex-col gap-1.5">
          <label for="f-desc" class="text-sm font-medium">Описание или фрагмент паспорта</label>
          <textarea id="f-desc" rows="6" maxlength="8000"
            class="w-full resize-y rounded-md border border-rule bg-sheet px-3 py-2 text-sm leading-6 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent"></textarea>
        </div>
      </div>

      <button id="run" type="button"
        class="motion-safe:transition motion-safe:duration-fast motion-safe:ease-smooth motion-safe:active:scale-[0.98] rounded-md bg-accent px-4 py-2.5 text-sm font-semibold text-accent-ink hover:opacity-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-paper disabled:cursor-not-allowed disabled:opacity-60">
        Сгенерировать карточку
      </button>
      <p class="text-xs text-ink-2"><kbd class="font-mono">Ctrl</kbd> + <kbd class="font-mono">Enter</kbd></p>
      <p id="status" role="status" aria-live="polite" class="min-h-5 text-sm text-ink-2"></p>
      <div id="error" role="alert" hidden class="border-l-2 border-warn bg-warn-bg/70 px-3 py-2 text-sm text-warn"></div>
    </section>

    <section aria-labelledby="out-title" class="min-w-0 border-t border-rule bg-sheet p-4 sm:p-8 lg:border-l lg:border-t-0">
      <h2 id="out-title" class="sr-only">Результат</h2>
      <div class="mb-8 flex flex-wrap items-end justify-between gap-x-3 gap-y-2 border-b border-rule">
        <div role="tablist" aria-label="Формат результата" class="flex gap-5">
          <button id="tab-card" role="tab" data-tab="card" aria-selected="true" aria-controls="output" type="button"
            class="tab -mb-px border-b-2 border-transparent pb-2.5 text-sm text-ink-2 hover:text-ink focus:outline-none focus-visible:ring-2 focus-visible:ring-accent aria-selected:border-accent aria-selected:font-semibold aria-selected:text-ink transition-colors duration-fast">Карточка</button>
          <button id="tab-markdown" role="tab" data-tab="markdown" aria-selected="false" aria-controls="output" type="button"
            class="tab -mb-px border-b-2 border-transparent pb-2.5 text-sm text-ink-2 hover:text-ink focus:outline-none focus-visible:ring-2 focus-visible:ring-accent aria-selected:border-accent aria-selected:font-semibold aria-selected:text-ink transition-colors duration-fast">Markdown</button>
          <button id="tab-json" role="tab" data-tab="json" aria-selected="false" aria-controls="output" type="button"
            class="tab -mb-px border-b-2 border-transparent pb-2.5 text-sm text-ink-2 hover:text-ink focus:outline-none focus-visible:ring-2 focus-visible:ring-accent aria-selected:border-accent aria-selected:font-semibold aria-selected:text-ink transition-colors duration-fast">JSON</button>
        </div>
        <div class="mb-2 flex gap-2">
          <button id="download" type="button" disabled
            class="motion-safe:transition motion-safe:duration-fast motion-safe:ease-smooth motion-safe:active:scale-[0.98] rounded-md border border-rule px-3 py-1 text-sm font-medium hover:border-accent hover:text-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-rule disabled:hover:text-ink">Скачать</button>
          <button id="copy" type="button" disabled
            class="motion-safe:transition motion-safe:duration-fast motion-safe:ease-smooth motion-safe:active:scale-[0.98] rounded-md border border-rule px-3 py-1 text-sm font-medium hover:border-accent hover:text-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-rule disabled:hover:text-ink">Копировать</button>
        </div>
      </div>
      <div id="output" role="tabpanel" tabindex="-1" class="focus:outline-none"></div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
