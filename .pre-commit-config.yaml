repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: check-repo
        name: no secrets or private files tracked
        entry: scripts/check_repo.sh
        language: system
        pass_filenames: false
